name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest -q
      - run: node --check frontend/character-references.js && node --check frontend/model-selection.js && node --check frontend/app.js && node --check frontend/i18n.js && node --check frontend/i18n-catalog.js
      - run: node --check frontend/workspace.js && node --check frontend/canvas-images.js && node --check frontend/canvas-core.js && node tests/canvas-core.test.cjs
